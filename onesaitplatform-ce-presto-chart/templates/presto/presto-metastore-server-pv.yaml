{{- if .Values.global.localStorageEnabled }}
apiVersion: v1
kind: PersistentVolume
metadata:
  name: pv-presto-metastore-server-db
  namespace: {{ .Release.Namespace }}
  labels:
    type: local
spec:
  storageClassName: {{ .Values.global.storageClassName }}
  capacity:
    storage: {{ .Values.presto.metastore.storage.pvSize }}
{{- if .Values.global.setNodesOnDeployments }}
  nodeAffinity:
    required:
      nodeSelectorTerms:
      - matchExpressions:
        - key: {{ .Values.global.nodeKey }}
          operator: In
          values:
          {{- range .Values.global.workerNodes }}
          - {{ .node }}
          {{- end }}
{{- end }}
  accessModes:
    - ReadWriteOnce
  hostPath:
    path: {{ .Values.global.localStoragePath }}/onesaitplatform/presto/metastore/mysql
{{- end }}