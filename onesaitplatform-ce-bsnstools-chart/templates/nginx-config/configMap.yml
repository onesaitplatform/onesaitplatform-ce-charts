{{- if or (.Values.deployment.selector.bpmengine) (.Values.deployment.selector.rulesengine) (.Values.deployment.selector.serverlessmng) (.Values.deployment.selector.tracingengine) }}
kind: ConfigMap
apiVersion: v1
metadata:
  name: bsnstools-config
  namespace: {{ .Release.Namespace }}
data:
  tools-nginx.conf: >

{{- if .Values.deployment.selector.bpmengine }}
      location ~ ^/(bpm-engine/actuator*) {
            deny all;
            return 404;
      }

      location /bpm-engine {
            proxy_pass http://bpmengine:27000/bpm-engine;
            proxy_set_header Host $host;

            proxy_redirect ~^http://(.+)$ https://$1;
      }
{{- end }}
{{- if .Values.deployment.selector.rulesengine }}
      location ~ ^/(rules-engine/actuator*) {
            deny all;
            return 404;
      }

      location /rules-engine {
            proxy_pass http://rules-engine-service:20200/rules-engine;
            proxy_set_header Host $host;
      }
{{- end }}
{{- if .Values.deployment.selector.serverlessmng }}
      location /serverless-manager {
            proxy_pass http://serverless-manager:8086/serverless-manager;
      }
      
      location /fn/{
           add_header Access-Control-Allow-Origin *;
           proxy_pass http://fnproject:8080/;
      }
      
       location /gitlab {
          proxy_set_header X-Real-IP $remote_addr;
          proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
          proxy_set_header X-Forwarded-Proto $scheme;
          proxy_set_header Host $http_host;
          
          proxy_http_version 1.1;
          proxy_set_header Connection "";
          chunked_transfer_encoding off;
          proxy_pass http://gitlabmanagerservice:10050/gitlab;
       }
{{- end }}
{{- if .Values.deployment.selector.tracingengine }}
       location /jaeger {
          proxy_set_header Host $host;
          #proxy_pass http://jaeger-service:16686/jaeger;
          proxy_pass http://jaeger:8080/jaeger;
          proxy_redirect ~^http://$1 https://$1;
          proxy_set_header X-Forwarded-Proto https;
          proxy_set_header X-Forwarded-For $remote_addr;
       }
{{- end }}
{{- end }}
